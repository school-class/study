<!DOCTYPE html>
<html lang="ja" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現在完了形 - 英語 | Study Platform</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-full flex flex-col bg-gray-50 text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="../../index.html" class="text-2xl font-bold text-blue-600">Study Platform</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow pb-20">
        <div class="bg-white border-b border-gray-200 sticky top-16 z-40">
            <div class="max-w-5xl mx-auto px-4 h-14 flex items-center">
                <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="15 19l-7-7 7-7"></path></svg>
                    授業一覧に戻る
                </a>
                <div class="mx-4 h-4 w-px bg-gray-200"></div>
                <span class="text-sm font-bold text-gray-900 truncate">現在完了形</span>
            </div>
        </div>

        <div class="max-w-5xl mx-auto px-4 mt-8">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-8 md:p-12">
                    <div class="mb-8">
                        <span class="inline-block px-4 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-orange-100 text-orange-600 mb-4">英語</span>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight">現在完了形</h1>
                    </div>

                    <div class="max-w-3xl mx-auto">
                        <section class="mb-12">
                            <h2 class="text-2xl font-bold mb-6 flex items-center">
                                <span class="w-2 h-8 bg-blue-600 rounded-full mr-4"></span>
                                この授業のポイント
                            </h2>
                            <div class="bg-blue-50/50 border border-blue-100 p-8 rounded-2xl">
                                <ul class="space-y-4">
                                    <li class="flex items-start">
                                        <svg class="w-6 h-6 text-blue-600 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span class="text-gray-700 font-medium leading-relaxed">have/has + 過去分詞の形で表す</span>
                                    </li>
                                    <li class="flex items-start">
                                        <svg class="w-6 h-6 text-blue-600 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span class="text-gray-700 font-medium leading-relaxed">「完了・結果」「経験」「継続」の3つの意味がある</span>
                                    </li>
                                    <li class="flex items-start">
                                        <svg class="w-6 h-6 text-blue-600 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span class="text-gray-700 font-medium leading-relaxed">過去の出来事が現在にどうつながっているかを表す</span>
                                    </li>
                                </ul>
                            </div>
                        </section>

                        <section>
                            <h2 class="text-2xl font-bold mb-6 flex items-center">
                                <span class="w-2 h-8 bg-blue-600 rounded-full mr-4"></span>
                                講義テキスト
                            </h2>
                            <div class="bg-white border border-gray-100 p-8 rounded-2xl shadow-sm leading-relaxed text-gray-700 text-lg">
                                現在完了形は、日本語にはない感覚なので難しく感じますが、「今持っている(have)状態」をイメージしましょう。過去にした経験を「今も持っている」から経験、過去に始めたことを「今も持っている」から継続になります。
                            </div>
                        </section>
                    </div>
                </div>

                <div class="bg-gray-50 px-8 py-8 border-t border-gray-200 flex justify-between items-center">
                    <a href="index.html" class="px-8 py-3 rounded-xl border border-gray-300 text-gray-600 font-bold hover:bg-white transition-all shadow-sm active:scale-95">戻る</a>
                    <a href="index.html" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition-all shadow-md shadow-blue-200 active:scale-95">一覧に戻る</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
